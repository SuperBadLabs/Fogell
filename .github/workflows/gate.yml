name: gate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Start disposable PostgreSQL
        run: ./scripts/ci-postgres.sh start
      - name: Native build, tests and controller proof
        run: ./scripts/build-and-test.sh
      - name: Stop disposable PostgreSQL
        if: always()
        run: ./scripts/ci-postgres.sh stop
